name: Contribution Proposal
description: Propose a new feature, package, or improvement to Soroban Dev Tools
title: "[Proposal] "
labels: ["proposal", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a contribution. Please fill in the sections below
        so maintainers can evaluate scope, fit, and priority before work starts.

  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What developer problem does this solve? Who is affected?
      placeholder: "When building a Soroban contract I need to … but currently …"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe what you want to build and how it would work.
    validations:
      required: true

  - type: textarea
    id: package
    attributes:
      label: Affected package(s)
      description: Which package(s) under `packages/` would this touch, or is a new package needed?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What other approaches did you consider? Why is this the right one?

  - type: checkboxes
    id: checklist
    attributes:
      label: Pre-submission checklist
      options:
        - label: I searched existing issues and PRs for duplicates
          required: true
        - label: This is scoped to a single concern
          required: true
        - label: I am willing to implement this myself (or help review a PR)
